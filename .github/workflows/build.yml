name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project
        run: |
          set -e
          for f in 14912.mp4 14857.mp4; do [ -f "$f" ] || { echo "Upload $f to the repo root"; exit 1; }; done
          P=proj/app/src/main
          mkdir -p $P/java/com/example/prank $P/res/raw $P/res/drawable $P/res/values
          cp 14912.mp4 $P/res/raw/scream.mp4
          cp 14857.mp4 $P/res/raw/boss.mp4
          cat > proj/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "antivirus"
          include(":app")
          EOF
          cat > proj/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          cat > proj/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > proj/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.prank"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.prank"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF
          cat > $P/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="antivirus"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".VideoActivity"
                      android:theme="@style/PrankTheme"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:launchMode="singleTask" />
              </application>
          </manifest>
          EOF
          cat > $P/res/values/styles.xml <<'EOF'
          <resources>
              <style name="PrankTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:backgroundDimEnabled">false</item>
              </style>
          </resources>
          EOF
          cat > $P/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1E88E5"
                  android:pathData="M54,14 L88,28 L88,54 C88,74 73,90 54,96 C35,90 20,74 20,54 L20,28 Z" />
              <path android:fillColor="#FFFFFF"
                  android:pathData="M46,60 L36,50 L31,55 L46,70 L77,39 L72,34 Z" />
          </vector>
          EOF
          cat > $P/java/com/example/prank/MainActivity.kt <<'EOF'
          package com.example.prank

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Дай дозвіл «Поверх інших додатків» і відкрий знову", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      finish()
                      return
                  }
                  setContentView(TextView(this).apply {
                      text = "привет медвет"
                      textSize = 32f
                      gravity = Gravity.CENTER
                  })
                  val appCtx = applicationContext
                  Handler(Looper.getMainLooper()).postDelayed({
                      moveTaskToBack(true)
                      Handler(Looper.getMainLooper()).postDelayed({
                          appCtx.startActivity(
                              Intent(appCtx, VideoActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          )
                      }, 2000)
                  }, 2000)
              }
          }
          EOF
          cat > $P/java/com/example/prank/VideoActivity.kt <<'EOF'
          package com.example.prank

          import android.content.Context
          import android.graphics.*
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.*
          import android.view.*
          import android.widget.FrameLayout
          import android.widget.VideoView
          import androidx.appcompat.app.AppCompatActivity
          import kotlin.random.Random

          class VideoActivity : AppCompatActivity() {
              private lateinit var root: FrameLayout
              private lateinit var audio: AudioManager
              private var oldVol = 0
              private val hd = Handler(Looper.getMainLooper())
              private val presses = ArrayList<Long>()
              private var game: Game? = null
              private var music: MediaPlayer? = null

              @Suppress("DEPRECATION")
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  setShowWhenLocked(true); setTurnScreenOn(true)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  audio = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  oldVol = audio.getStreamVolume(AudioManager.STREAM_MUSIC)
                  val t = audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC) * 70 / 100
                  if (oldVol < t) audio.setStreamVolume(AudioManager.STREAM_MUSIC, t, 0)
                  root = FrameLayout(this); setContentView(root)
                  play(R.raw.scream) { play(R.raw.boss) { root.post { fight() } } }
              }

              private fun play(res: Int, done: () -> Unit) {
                  root.removeAllViews(); root.setBackgroundColor(Color.BLACK)
                  val v = VideoView(this)
                  root.addView(v, FrameLayout.LayoutParams(-1, -1))
                  v.setVideoURI(Uri.parse("android.resource://$packageName/$res"))
                  v.setOnCompletionListener { done() }
                  v.setOnErrorListener { _, _, _ -> done(); true }
                  v.start()
              }

              private fun fight() {
                  root.removeAllViews(); root.setBackgroundColor(Color.TRANSPARENT)
                  music = MediaPlayer.create(this, R.raw.boss)?.apply { isLooping = true; start() }
                  game = Game(this, root.width, root.height).also { root.addView(it); it.start() }
              }

              override fun onKeyDown(k: Int, e: KeyEvent): Boolean {
                  if (k == KeyEvent.KEYCODE_VOLUME_UP) {
                      if (e.repeatCount == 0) {
                          val n = SystemClock.uptimeMillis()
                          presses.add(n); presses.removeAll { n - it > 3000 }
                          if (presses.size >= 3) finish()
                      }
                      return true
                  }
                  return super.onKeyDown(k, e)
              }

              override fun onDestroy() {
                  game?.stop(); hd.removeCallbacksAndMessages(null)
                  runCatching { music?.stop(); music?.release() }
                  runCatching { audio.setStreamVolume(AudioManager.STREAM_MUSIC, oldVol, 0) }
                  super.onDestroy()
              }

              inner class Game(ctx: Context, private val w: Int, private val h: Int) : View(ctx) {
                  private val d = resources.displayMetrics.density
                  private val bs = w * 0.26f
                  private val ps = w * 0.13f
                  private val by0 = h * 0.12f
                  private var bx = (w - bs) / 2f
                  private var dir = 1
                  private var px = (w - ps) / 2f
                  private var py = h * 0.78f
                  private var hp = 100
                  private var lives = 3
                  private val mine = ArrayList<RectF>()
                  private val theirs = ArrayList<RectF>()
                  private var t1 = 0L
                  private var t2 = 0L
                  private var msg = ""
                  private var msgUntil = 0L
                  private var won = false
                  private var run = true
                  private val t0 = SystemClock.uptimeMillis()
                  private var last = t0
                  private val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val cols = intArrayOf(Color.CYAN, Color.MAGENTA, Color.GREEN, Color.BLACK, Color.WHITE, Color.RED)

                  private val tk = object : Runnable {
                      override fun run() {
                          if (!run) return
                          val n = SystemClock.uptimeMillis()
                          val dt = (n - last).coerceAtMost(50); last = n
                          step(dt, n); invalidate()
                          hd.postDelayed(this, 16)
                      }
                  }
                  fun start() { tk.run() }
                  fun stop() { run = false; hd.removeCallbacks(tk) }

                  private fun step(dt: Long, n: Long) {
                      if (won) return
                      bx += dir * w * 0.0003f * dt
                      if (bx < 0) { bx = 0f; dir = 1 }
                      if (bx > w - bs) { bx = w - bs; dir = -1 }
                      if (n - t1 > 260) { t1 = n; val c = px + ps / 2; mine.add(RectF(c - 5 * d, py - 24 * d, c + 5 * d, py)) }
                      if (n - t2 > 850) {
                          t2 = n
                          val c = bx + bs / 2 + Random.nextInt(-(bs / 3).toInt(), (bs / 3).toInt())
                          theirs.add(RectF(c - 9 * d, by0 + bs, c + 9 * d, by0 + bs + 18 * d))
                      }
                      val up = h * 0.0011f * dt
                      val dn = h * 0.0007f * dt
                      val boss = RectF(bx, by0, bx + bs, by0 + bs)
                      val me = RectF(px + ps * 0.1f, py + ps * 0.1f, px + ps * 0.9f, py + ps * 0.9f)
                      val i = mine.iterator()
                      while (i.hasNext()) {
                          val s = i.next(); s.offset(0f, -up)
                          if (RectF.intersects(s, boss)) { i.remove(); hp -= 2 } else if (s.bottom < 0) i.remove()
                      }
                      val j = theirs.iterator()
                      while (j.hasNext()) {
                          val s = j.next(); s.offset(0f, dn)
                          if (RectF.intersects(s, me)) { j.remove(); lives-- } else if (s.top > h) j.remove()
                      }
                      if (hp <= 0) {
                          won = true; msg = "ПЕРЕМОГА!"; msgUntil = Long.MAX_VALUE
                          hd.postDelayed({ finish() }, 1800)
                      } else if (lives <= 0) {
                          hp = 100; lives = 3; mine.clear(); theirs.clear()
                          msg = "ПРОГРАВ! ЩЕ РАЗ!"; msgUntil = n + 1200
                      }
                  }

                  override fun onDraw(c: Canvas) {
                      val n = SystemClock.uptimeMillis()
                      p.style = Paint.Style.FILL; p.color = Color.rgb(220, 30, 30)
                      c.drawRect(bx, by0, bx + bs, by0 + bs, p)
                      p.style = Paint.Style.STROKE; p.strokeWidth = 4 * d; p.color = Color.WHITE
                      c.drawRect(bx, by0, bx + bs, by0 + bs, p)
                      p.style = Paint.Style.FILL; p.textAlign = Paint.Align.CENTER; p.textSize = bs * 0.3f
                      c.drawText("БОС", bx + bs / 2, by0 + bs / 2 + bs * 0.1f, p)
                      p.color = Color.rgb(0, 200, 255); c.drawRect(px, py, px + ps, py + ps, p)
                      p.style = Paint.Style.STROKE; p.color = Color.WHITE; c.drawRect(px, py, px + ps, py + ps, p)
                      p.style = Paint.Style.FILL
                      p.color = Color.YELLOW; for (s in mine) c.drawRect(s, p)
                      p.color = Color.RED; for (s in theirs) c.drawRect(s, p)
                      p.color = Color.argb(160, 0, 0, 0); c.drawRect(20 * d, 8 * d, w - 20 * d, 24 * d, p)
                      p.color = Color.RED; c.drawRect(20 * d, 8 * d, 20 * d + (w - 40 * d) * hp.coerceAtLeast(0) / 100f, 24 * d, p)
                      p.color = Color.WHITE; p.textSize = 22 * d; p.textAlign = Paint.Align.LEFT
                      c.drawText("♥".repeat(lives.coerceAtLeast(0)), 20 * d, h - 12 * d, p)
                      if (n < msgUntil) {
                          p.textSize = 40 * d; p.textAlign = Paint.Align.CENTER
                          c.drawText(msg, w / 2f, h / 2f, p)
                      }
                      glitch(c, n)
                  }

                  private fun glitch(c: Canvas, n: Long) {
                      val heavy = n - t0 < 2500
                      if (!heavy && (n / 700) % 6 != 0L) return
                      p.style = Paint.Style.FILL
                      repeat(if (heavy) 16 else 6) {
                          p.color = cols[Random.nextInt(cols.size)]; p.alpha = 150
                          val y = Random.nextInt(h).toFloat()
                          val x = Random.nextInt(w / 2).toFloat()
                          c.drawRect(x, y, x + Random.nextInt(w / 4, w), y + Random.nextInt(3, 40) * d, p)
                      }
                      if (heavy) {
                          p.color = Color.BLACK; p.alpha = 230
                          c.drawRect(0f, h * 0.45f, w.toFloat(), h * 0.55f, p)
                          p.color = Color.WHITE; p.alpha = 255; p.textAlign = Paint.Align.CENTER; p.textSize = 26 * d
                          c.drawText("SYSTEM UI CRASHED", w / 2f, h * 0.51f, p)
                      }
                      p.alpha = 255; p.textAlign = Paint.Align.LEFT
                  }

                  override fun onTouchEvent(e: MotionEvent): Boolean {
                      px = (e.x - ps / 2).coerceIn(0f, w - ps)
                      py = (e.y - ps / 2 - 60 * d).coerceIn(h * 0.5f, h - ps - 10 * d)
                      return true
                  }
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: antivirus-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
